name: build-apk

# 离线安卓 App 打包：本机无 Android 工具链时，由 GitHub Actions 代为编译。
# - push 到 main：构建 release 签名 APK 并上传为 artifact（便于快速下载验证）
# - 打 v* 标签：额外发布到 GitHub Release，资产固定命名为 jp-lingo.apk，
#   供发布页 https://github.com/oklspko/jplingo/releases/latest/download/jp-lingo.apk 下载。
#
# 签名依赖三个仓库 Secret（密钥库本身不落盘进仓库，私钥不公开）：
#   RELEASE_KEYSTORE_BASE64     密钥库 .p12 的 base64
#   RELEASE_KEYSTORE_PASSWORD   密钥库口令
#   RELEASE_KEYSTORE_ALIAS      密钥别名

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 发布 Release 需要写权限（默认 GITHUB_TOKEN 常为只读，会导致 Publish 步骤 403）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 安装 compileSdk 36 对应的 platform 与 build-tools（自动接受许可）
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate static site
        run: pnpm generate
        env:
          # 登录/云同步所需的 Supabase 凭据，需在仓库 Secrets 中配置
          # （未配置时登录不可用，但离线功能不受影响）
          NUXT_SUPABASE_URL: ${{ secrets.NUXT_SUPABASE_URL }}
          NUXT_SUPABASE_ANON_KEY: ${{ secrets.NUXT_SUPABASE_ANON_KEY }}

      - name: Sync APK version from package.json
        run: node scripts/sync-apk-version.cjs

      - name: Sync Capacitor web assets
        run: npx cap sync android

      # 离线日语 TTS：sherpa-onnx 预编译运行时（arm64-v8a）+ Java API 源码
      # 语言模型（Supertonic-3 int8，约 123MB）不打进 APK，由 App 首次使用时下载
      - name: Fetch sherpa-onnx runtime and Java API
        run: |
          set -e
          SHERPA_VERSION="v1.13.8"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          curl -fsSL -o /tmp/sherpa-android.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}-android.tar.bz2"
          mkdir -p /tmp/sherpa-android
          tar -xjf /tmp/sherpa-android.tar.bz2 -C /tmp/sherpa-android
          SO_DIR="$(find /tmp/sherpa-android -type d -name 'arm64-v8a' | head -n 1)"
          echo "found so dir: ${SO_DIR}"
          ls -lh "${SO_DIR}"
          cp "${SO_DIR}"/*.so android/app/src/main/jniLibs/arm64-v8a/

          git clone --depth 1 --branch "${SHERPA_VERSION}" https://github.com/k2-fsa/sherpa-onnx /tmp/sherpa-src
          JAVA_API_DIR="$(find /tmp/sherpa-src -type d -path '*com/k2fsa/sherpa/onnx' | head -n 1)"
          echo "found java api dir: ${JAVA_API_DIR}"
          mkdir -p android/app/src/main/java/com/k2fsa/sherpa
          cp -r "${JAVA_API_DIR}" android/app/src/main/java/com/k2fsa/sherpa/onnx
          ls android/app/src/main/java/com/k2fsa/sherpa/onnx | head -n 20

      - name: Decode signing keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release-key.p12

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.p12
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk jp-lingo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jp-lingo-apk
          path: jp-lingo.apk

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: jp-lingo.apk
          generate_release_notes: true
