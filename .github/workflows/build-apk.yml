name: build-apk

# 离线安卓 App 打包：本机无 Android 工具链时，由 GitHub Actions 代为编译。
# - push 到 main：构建 release 签名 APK 并上传为 artifact（便于快速下载验证）
# - 打 v* 标签：额外发布到 GitHub Release，资产固定命名为 jp-lingo.apk，
#   供发布页 https://github.com/oklspko/jplingo/releases/latest/download/jp-lingo.apk 下载。
#
# 签名依赖三个仓库 Secret（密钥库本身不落盘进仓库，私钥不公开）：
#   RELEASE_KEYSTORE_BASE64     密钥库 .p12 的 base64
#   RELEASE_KEYSTORE_PASSWORD   密钥库口令
#   RELEASE_KEYSTORE_ALIAS      密钥别名

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 发布 Release 需要写权限（默认 GITHUB_TOKEN 常为只读，会导致 Publish 步骤 403）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 安装 compileSdk 36 对应的 platform 与 build-tools（自动接受许可）
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate static site
        run: pnpm generate
        env:
          # 登录/云同步所需的 Supabase 凭据，需在仓库 Secrets 中配置
          # （未配置时登录不可用，但离线功能不受影响）
          NUXT_SUPABASE_URL: ${{ secrets.NUXT_SUPABASE_URL }}
          NUXT_SUPABASE_ANON_KEY: ${{ secrets.NUXT_SUPABASE_ANON_KEY }}
          # 离线语音模型包地址：默认走官方 Release + 加速镜像；
          # 想自托管就在仓库 Variables 里设 NUXT_TTS_MODEL_URL（留空即回落默认，见 DEPLOY.md）
          NUXT_TTS_MODEL_URL: ${{ vars.NUXT_TTS_MODEL_URL }}

      - name: Sync APK version from package.json
        run: node scripts/sync-apk-version.cjs

      # 预生成音频（讯飞 mp3，约 72MB）不再进 APK：App 改用内置离线引擎发音。
      # 只从 APK 载荷里删，仓库与网页端（EdgeOne/自托管）仍保留这些 mp3。
      - name: Strip pre-generated audio from APK payload
        run: |
          if [ -d .output/public/audio ]; then
            echo "移除 .output/public/audio（$(du -sm .output/public/audio | cut -f1) MB，$(find .output/public/audio -type f | wc -l) 个文件）"
            rm -rf .output/public/audio
          fi
          ls .output/public | head -20

      # 让 APK 只带「上一版」的数据：本次新增的课程/语法内容不打包进去，
      # 留给 App 启动后的数据热更新拉取——这样「不重装也能拿到新课」才可验证，
      # 也符合真实发布节奏（内容可以随时更新，不必等用户升级 App）。
      - name: Strip newest hot-update data from APK payload
        run: node scripts/strip-apk-test-data.cjs

      - name: Sync Capacitor web assets
        run: npx cap sync android

      # 内置离线语音模型：解压出 7 个模型文件放进 assets，装机即有，不再依赖手机联网下载
      # （之前「我的」页那个下载入口保留为兜底，装了就不再显示）
      - name: Bundle offline TTS model into APK assets
        run: |
          set -e
          TARBALL="sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2"
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/${TARBALL}"
          curl -fsSL --retry 3 -o "/tmp/${TARBALL}" "https://gh-proxy.com/${URL}" \
            || curl -fsSL --retry 3 -o "/tmp/${TARBALL}" "${URL}"
          echo "82fa96f91c4ef8abaae3a14a3f4153facf88bed821d1f7331cec2700f432c427  /tmp/${TARBALL}" | sha256sum -c -
          tar -xjf "/tmp/${TARBALL}" -C /tmp
          SRC="/tmp/sherpa-onnx-supertonic-3-tts-int8-2026-05-11"
          DEST="android/app/src/main/assets/tts-ja"
          mkdir -p "${DEST}"
          for f in duration_predictor.int8.onnx text_encoder.int8.onnx vector_estimator.int8.onnx \
                   vocoder.int8.onnx tts.json unicode_indexer.bin voice.bin; do
            cp "${SRC}/${f}" "${DEST}/${f}"
          done
          ls -lh "${DEST}"
          du -sh "${DEST}"

      # 离线日语 TTS：官方 Android AAR（arm64-v8a 运行时 .so + com.k2fsa.sherpa.onnx API）
      - name: Fetch sherpa-onnx Android AAR
        run: |
          set -e
          mkdir -p android/app/libs
          curl -fsSL -o android/app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar"
          # 固定 sha256，防止 CDN/代理返回损坏或被替换的产物
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  android/app/libs/sherpa-onnx.aar" | sha256sum -c -
          ls -lh android/app/libs/
      - name: Decode signing keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release-key.p12

      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/gradle-build.log
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.p12
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}

      # 构建失败时把关键报错贴到 commit 评论：本地 gh 取完整日志常被网络/权限挡住，
      # 评论里直接能看到 javac/gradle 的报错，省一轮来回。
      - name: Report build failure on commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f /tmp/gradle-build.log ]; then
            grep -nE "error:|What went wrong|Execution failed|FAILED|Could not (resolve|find)|Caused by|> Task" \
              /tmp/gradle-build.log | tail -n 60 > /tmp/digest.txt || true
            echo "...（完整日志见下方 artifact）" >> /tmp/digest.txt
            tail -n 25 /tmp/gradle-build.log >> /tmp/digest.txt
          else
            echo "失败发生在 gradle 之前，没有 gradle 日志。" > /tmp/digest.txt
          fi
          {
            echo "❌ build-apk 失败：\`${{ github.sha }}\`"
            echo
            echo "运行日志：${run_url}"
            echo
            echo '```'
            cat /tmp/digest.txt
            echo '```'
          } > /tmp/comment.md
          jq -Rs '{body: .}' /tmp/comment.md > /tmp/comment.json
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/comment.json

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk jp-lingo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jp-lingo-apk
          path: jp-lingo.apk

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: jp-lingo.apk
          generate_release_notes: true
